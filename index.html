<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electricity Bill Splitter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #f5f7fa; min-height: 100vh; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 24px; }
    .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card h2 { color: #34495e; margin-bottom: 16px; font-size: 1.1rem; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-size: 0.85rem; color: #666; margin-bottom: 6px; }
    .form-group input { padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; }
    .form-group input:focus { outline: none; border-color: #3498db; }
    .rate-display { background: #e8f5e9; padding: 12px; border-radius: 6px; text-align: center; margin-top: 12px; }
    .rate-display .value { font-size: 1.4rem; font-weight: bold; color: #2e7d32; }
    .rate-display .label { font-size: 0.8rem; color: #666; }
    .tenant-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .tenant-header h2 { border: none; padding: 0; margin: 0; }
    .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
    .btn-primary { background: #3498db; color: white; }
    .btn-primary:hover { background: #2980b9; }
    .btn-secondary { background: #95a5a6; color: white; }
    .btn-danger { background: #e74c3c; color: white; padding: 8px 12px; font-size: 0.8rem; }
    .btn-success { background: #27ae60; color: white; width: 100%; padding: 14px; font-size: 1rem; }
    .btn-success:hover { background: #219a52; }
    .tenant-list { display: flex; flex-direction: column; gap: 12px; }
    .tenant-card { display: grid; grid-template-columns: 60px 1fr 100px 100px 100px 40px; gap: 10px; align-items: center; background: #f8f9fa; padding: 12px; border-radius: 8px; }
    .tenant-card .tenant-num { font-weight: bold; color: #3498db; text-align: center; }
    .tenant-card input { padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; }
    .tenant-card .consumption { text-align: center; color: #666; font-size: 0.9rem; }
    .results-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    .results-table th, .results-table td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
    .results-table th { background: #f8f9fa; font-weight: 600; color: #34495e; }
    .results-table .num { text-align: right; }
    .results-table .total-row { background: #e8f5e9; font-weight: bold; }
    .difference-info { background: #fff3e0; padding: 12px; border-radius: 6px; margin-top: 12px; font-size: 0.9rem; color: #e65100; }
    .validation { padding: 12px; border-radius: 6px; margin-top: 12px; text-align: center; }
    .validation.success { background: #e8f5e9; color: #2e7d32; }
    .validation.error { background: #ffebee; color: #c62828; }
    .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 16px; }
    .tenant-bill-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 12px; padding: 20px; color: white; }
    .tenant-bill-card .tenant-name { font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; }
    .tenant-bill-card .consumption-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .tenant-bill-card .label { opacity: 0.9; font-size: 0.9rem; }
    .tenant-bill-card .value { font-weight: 600; }
    .tenant-bill-card .bill-amount { font-size: 1.4rem; font-weight: bold; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.3); }
    .total-card { background: #1a1a2e; border-radius: 12px; padding: 20px; margin-top: 16px; display: flex; justify-content: space-between; align-items: center; color: white; }
    .total-card .total-label { font-size: 1.1rem; }
    .total-card .total-value { font-size: 1.5rem; font-weight: bold; }
    .empty-state { text-align: center; color: #999; padding: 40px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ Electricity Bill Splitter</h1>
    
    <div class="card">
      <h2>Main Meter Billing</h2>
      <div class="form-row">
        <div class="form-group">
          <label>Total Billing Price (₱)</label>
          <input type="number" id="mainBilling" placeholder="e.g. 16431.76" step="0.01" onchange="calculateRate()">
        </div>
        <div class="form-group">
          <label>Main Meter Consumption (kWh)</label>
          <input type="number" id="mainConsumption" placeholder="e.g. 1084" onchange="calculateRate()">
        </div>
      </div>
      <div class="rate-display">
        <div class="label">Calculated Rate per kWh</div>
        <div class="value" id="rateDisplay">₱0.00</div>
      </div>
    </div>

    <div class="card">
      <div class="tenant-header">
        <h2>Submeter Tenants (1-10)</h2>
        <div>
          <button class="btn btn-secondary" onclick="addTenant()">+ Add Tenant</button>
        </div>
      </div>
      <div id="tenantList" class="tenant-list"></div>
    </div>

    <button class="btn btn-success" onclick="calculateBilling()">Calculate All Tenants Billing</button>

    <div class="card" id="resultsCard" style="display: none;">
      <h2>Billing Results</h2>
      <div id="differenceInfo" class="difference-info"></div>
      <div id="totalSubmeterConsumption" class="difference-info" style="background: #e3f2fd; color: #1565c0;"></div>
      <div id="validation" class="validation"></div>
      <div id="resultsGrid" class="results-grid"></div>
      <div id="totalCard" class="total-card"></div>
    </div>
  </div>

  <script>
    let tenants = [];

    function init() {
      addTenant();
    }

    function calculateRate() {
      const mainBilling = parseFloat(document.getElementById('mainBilling').value);
      const mainConsumption = parseFloat(document.getElementById('mainConsumption').value);
      
      if (mainBilling && mainConsumption) {
        const ratePerKwh = mainBilling / mainConsumption;
        document.getElementById('rateDisplay').textContent = `₱${ratePerKwh.toFixed(4)}`;
      } else {
        document.getElementById('rateDisplay').textContent = `₱0.00`;
      }
    }

    function addTenant() {
      if (tenants.length >= 10) {
        alert('Maximum 10 tenants allowed');
        return;
      }
      tenants.push({ name: '', oldRead: 0, newRead: 0 });
      renderTenants();
    }

    function removeTenant(index) {
      if (tenants.length <= 1) {
        alert('At least 1 tenant required');
        return;
      }
      tenants.splice(index, 1);
      renderTenants();
    }

    function updateTenant(index, field, value) {
      tenants[index][field] = field === 'name' ? value : parseFloat(value) || 0;
      updateTenantConsumption(index);
    }

    function updateTenantConsumption(index) {
      const t = tenants[index];
      const card = document.querySelectorAll('.tenant-card')[index];
      if (card && t.oldRead > 0 && t.newRead > 0) {
        const consumption = t.newRead >= t.oldRead ? t.newRead - t.oldRead : 0;
        card.querySelector('.consumption').textContent = `${consumption} kWh`;
      } else {
        card.querySelector('.consumption').textContent = `0 kWh`;
      }
    }

    function getConsumption(index) {
      const t = tenants[index];
      return t.newRead >= t.oldRead ? t.newRead - t.oldRead : 0;
    }

    function renderTenants() {
      const container = document.getElementById('tenantList');
      container.innerHTML = tenants.map((t, i) => `
        <div class="tenant-card">
          <div class="tenant-num">Tenant ${i + 1}</div>
          <input type="text" placeholder="Name" value="${t.name}" onchange="updateTenant(${i}, 'name', this.value)">
          <input type="number" placeholder="Old" value="${t.oldRead || ''}" onchange="updateTenant(${i}, 'oldRead', this.value)">
          <input type="number" placeholder="New" value="${t.newRead || ''}" onchange="updateTenant(${i}, 'newRead', this.value)">
          <div class="consumption">${getConsumption(i)} kWh</div>
          <button class="btn btn-danger" onclick="removeTenant(${i})">×</button>
        </div>
      `).join('');
    }

    function calculateBilling() {
      const mainBilling = parseFloat(document.getElementById('mainBilling').value);
      const mainConsumption = parseFloat(document.getElementById('mainConsumption').value);

      if (!mainBilling || !mainConsumption) {
        alert('Please enter main billing price and consumption');
        return;
      }

      calculateRate();

      const ratePerKwh = mainBilling / mainConsumption;

      const tenantConsumptions = tenants.map((_, i) => getConsumption(i));
      const totalSubmeterConsumption = tenantConsumptions.reduce((a, b) => a + b, 0);
      const diff = mainConsumption - totalSubmeterConsumption;
      
      let diffPerTenant;
      if (totalSubmeterConsumption > mainConsumption) {
        diffPerTenant = diff / tenants.length;
      } else {
        diffPerTenant = diff / tenants.length;
      }

      let diffMessage = '';
      if (diff !== 0) {
        const action = diff > 0 ? 'deducted from' : 'added to';
        diffMessage = `Difference: ${Math.abs(diff).toFixed(2)} kWh (${Math.abs(diffPerTenant).toFixed(2)} per tenant will be ${action} consumption)`;
      }
      document.getElementById('differenceInfo').textContent = diffMessage;
      document.getElementById('totalSubmeterConsumption').textContent = `Total Submeter Consumption: ${totalSubmeterConsumption.toFixed(2)} kWh`;

      const adjustedConsumptions = tenantConsumptions.map(c => {
        if (totalSubmeterConsumption > mainConsumption) {
          return c - diffPerTenant;
        } else {
          return c + diffPerTenant;
        }
      });
      const bills = adjustedConsumptions.map(c => c * ratePerKwh);
      const totalBill = bills.reduce((a, b) => a + b, 0);

      const isValid = Math.abs(totalBill - mainBilling) < 0.01;
      const validationEl = document.getElementById('validation');
      validationEl.className = `validation ${isValid ? 'success' : 'error'}`;
      validationEl.textContent = isValid 
        ? `✓ Formula validated - Total matches main billing (₱${totalBill.toFixed(2)})`
        : `⚠ Total mismatch: ₱${totalBill.toFixed(2)} vs ₱${mainBilling.toFixed(2)}`;

      document.getElementById('resultsGrid').innerHTML = tenants.map((t, i) => `
        <div class="tenant-bill-card">
          <div class="tenant-name">${t.name || `Tenant ${i + 1}`}</div>
          <div class="consumption-row">
            <span class="label">Raw Consumption</span>
            <span class="value">${tenantConsumptions[i].toFixed(2)} kWh</span>
          </div>
          <div class="consumption-row">
            <span class="label">Adjusted Consumption</span>
            <span class="value">${adjustedConsumptions[i].toFixed(2)} kWh</span>
          </div>
          <div class="consumption-row">
            <span class="label">Rate</span>
            <span class="value">₱${ratePerKwh.toFixed(4)}/kWh</span>
          </div>
          <div class="bill-amount">₱${bills[i].toFixed(2)}</div>
        </div>
      `).join('');

      document.getElementById('totalCard').innerHTML = `
        <span class="total-label">Total Billing</span>
        <span class="total-value">₱${totalBill.toFixed(2)}</span>
      `;

      document.getElementById('resultsCard').style.display = 'block';
    }

    init();
  </script>
</body>
</html>
