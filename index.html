<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bill Splitter - Multi Tenant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen py-8 px-4">
  <div class="max-w-4xl mx-auto">
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
      <div class="bg-gradient-to-r from-blue-600 to-blue-800 px-6 py-4">
        <h1 class="text-2xl font-bold text-white"><i class="fas fa-bolt mr-2"></i>Bill Splitter</h1>
        <p class="text-blue-100 text-sm">Split electricity bills among multiple tenants</p>
      </div>

      <div class="p-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Rate (₱/kWh)</label>
            <input type="number" id="ratePerKwh" step="0.01" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="e.g. 15.16">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Total kWh</label>
            <input type="number" id="totalKwh" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="1084">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Total Bill (₱)</label>
            <input type="number" id="totalBill" step="0.01" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="16431.76">
          </div>
        </div>
        <p class="text-xs text-gray-500">Enter Rate + Total kWh to auto-calculate Total Bill, or enter Total Bill directly.</p>

        <div class="border-t pt-6">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold text-gray-800"><i class="fas fa-plus-circle mr-2"></i>Additional Charges</h2>
            <button onclick="addAdditionalCharge()" class="px-3 py-1 text-sm bg-purple-100 hover:bg-purple-200 text-purple-700 rounded-lg transition flex items-center gap-1">
              <i class="fas fa-plus"></i> Add
            </button>
          </div>
          <div id="additionalChargesContainer" class="space-y-2"></div>
        </div>

        <div class="border-t pt-6">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold text-gray-800"><i class="fas fa-users mr-2"></i>Tenants</h2>
            <button onclick="addTenant()" class="px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg transition flex items-center gap-2">
              <i class="fas fa-plus"></i> Add Tenant
            </button>
          </div>
          
          <div id="tenantsContainer" class="space-y-3"></div>
        </div>

        <button onclick="calculate()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition text-lg">
          <i class="fas fa-calculator mr-2"></i>Calculate
        </button>

        <div id="results" class="hidden">
          <div class="border-t pt-6">
            <h2 class="text-lg font-semibold text-gray-800 mb-4"><i class="fas fa-receipt mr-2"></i>This Month's Breakdown</h2>
            <div id="resultsContent" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
          </div>
        </div>

        <div id="debtSection" class="hidden border-t pt-6">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold text-gray-800"><i class="fas fa-history mr-2"></i>Tenant Debt History</h2>
            <button onclick="clearHistory()" class="px-3 py-1 text-sm text-red-600 hover:text-red-800">Clear History</button>
          </div>
          <div id="debtContent" class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-4 py-2 text-left">Tenant</th>
                  <th class="px-4 py-2 text-right">Current</th>
                  <th class="px-4 py-2 text-right">Previous Debt</th>
                  <th class="px-4 py-2 text-right">Total Owed</th>
                  <th class="px-4 py-2 text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="debtTable"></tbody>
            </table>
          </div>
          <button onclick="settleDebt()" class="mt-4 px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-lg transition">
            <i class="fas fa-check-double mr-2"></i>Settle All Debts
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let tenantCount = 0;
    let tenants = [];
    let chargeCount = 0;

    function loadTenants() {
      const saved = localStorage.getItem('billSplitter_tenants');
      if (saved) {
        tenants = JSON.parse(saved);
        tenants.forEach((t, i) => addTenantField(t.name, t.kwh));
      } else {
        for (let i = 0; i < 4; i++) addTenantField(`Tenant ${i + 1}`, '');
      }
    }

    function saveTenants() {
      const tenantData = tenants.map(t => ({ name: t.name, kwh: t.kwh }));
      localStorage.setItem('billSplitter_tenants', JSON.stringify(tenantData));
      
      const ratePerKwh = document.getElementById('ratePerKwh').value;
      const totalKwh = document.getElementById('totalKwh').value;
      const totalBill = document.getElementById('totalBill').value;
      localStorage.setItem('billSplitter_rates', JSON.stringify({ ratePerKwh, totalKwh, totalBill }));
    }

    function addTenantField(name = '', kwh = '') {
      tenantCount++;
      const container = document.getElementById('tenantsContainer');
      const div = document.createElement('div');
      div.className = 'flex gap-2 items-center tenant-row';
      div.dataset.id = tenantCount;
      div.innerHTML = `
        <input type="text" value="${name}" placeholder="Tenant name" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 tenant-name">
        <input type="number" value="${kwh}" placeholder="kWh" class="w-24 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 tenant-kwh">
        <button onclick="removeTenant(${tenantCount})" class="px-3 py-2 bg-red-100 hover:bg-red-200 text-red-600 rounded-lg transition">
          <i class="fas fa-times"></i>
        </button>
      `;
      container.appendChild(div);
    }

    function addTenant() {
      tenantCount++;
      addTenantField(`Tenant ${tenantCount}`, '');
    }

    function addAdditionalCharge(name = '', amount = '') {
      chargeCount++;
      const container = document.getElementById('additionalChargesContainer');
      const div = document.createElement('div');
      div.className = 'flex gap-2 items-center charge-row';
      div.dataset.id = chargeCount;
      div.innerHTML = `
        <input type="text" value="${name}" placeholder="Charge name (e.g. Water, Pest Control)" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 charge-name">
        <input type="number" value="${amount}" placeholder="Amount (₱)" step="0.01" class="w-32 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 charge-amount">
        <button onclick="removeAdditionalCharge(${chargeCount})" class="px-3 py-2 bg-red-100 hover:bg-red-200 text-red-600 rounded-lg transition">
          <i class="fas fa-times"></i>
        </button>
      `;
      container.appendChild(div);
    }

    function removeAdditionalCharge(id) {
      const row = document.querySelector(`.charge-row[data-id="${id}"]`);
      if (row) row.remove();
    }

    function getAdditionalCharges() {
      const rows = document.querySelectorAll('.charge-row');
      const charges = [];
      rows.forEach(row => {
        const name = row.querySelector('.charge-name').value;
        const amount = parseFloat(row.querySelector('.charge-amount').value) || 0;
        if (name || amount) charges.push({ name, amount });
      });
      return charges;
    }

    function loadAdditionalCharges() {
      const saved = localStorage.getItem('billSplitter_additionalCharges');
      if (saved) {
        const charges = JSON.parse(saved);
        charges.forEach(c => addAdditionalCharge(c.name, c.amount));
      }
    }

    function saveAdditionalCharges() {
      const chargeData = getAdditionalCharges();
      localStorage.setItem('billSplitter_additionalCharges', JSON.stringify(chargeData));
    }

    function removeTenant(id) {
      const row = document.querySelector(`.tenant-row[data-id="${id}"]`);
      if (row) row.remove();
    }

    function getTenantData() {
      const rows = document.querySelectorAll('.tenant-row');
      const data = [];
      rows.forEach(row => {
        const name = row.querySelector('.tenant-name').value;
        const kwh = parseFloat(row.querySelector('.tenant-kwh').value) || 0;
        if (name || kwh) data.push({ name, kwh });
      });
      return data;
    }

    function calculate() {
      const ratePerKwh = parseFloat(document.getElementById('ratePerKwh').value) || 0;
      const totalKwh = parseFloat(document.getElementById('totalKwh').value) || 0;
      let totalBill = parseFloat(document.getElementById('totalBill').value) || 0;
      
      if (ratePerKwh > 0 && totalKwh > 0 && totalBill === 0) {
        totalBill = ratePerKwh * totalKwh;
        document.getElementById('totalBill').value = totalBill.toFixed(2);
      }

      const currentTenants = getTenantData();
      const additionalCharges = getAdditionalCharges();
      
      if (currentTenants.length === 0) {
        alert('Please add at least one tenant');
        return;
      }

      const effectiveRate = totalKwh > 0 ? totalBill / totalKwh : ratePerKwh;
      const totalTenantKwh = currentTenants.reduce((sum, t) => sum + t.kwh, 0);
      const sharedKwh = Math.max(0, totalKwh - totalTenantKwh);
      const sharedCost = sharedKwh * effectiveRate;
      const sharedPerTenant = currentTenants.length > 0 ? sharedCost / currentTenants.length : 0;

      const totalAdditionalCharges = additionalCharges.reduce((sum, c) => sum + c.amount, 0);
      const additionalPerTenant = currentTenants.length > 0 ? totalAdditionalCharges / currentTenants.length : 0;

      const currentAmounts = currentTenants.map(t => {
        return (t.kwh * effectiveRate) + sharedPerTenant + additionalPerTenant;
      });

      const resultsDiv = document.getElementById('results');
      const resultsContent = document.getElementById('resultsContent');
      resultsDiv.classList.remove('hidden');
      resultsContent.innerHTML = '';

      currentTenants.forEach((tenant, i) => {
        const consumptionCost = tenant.kwh * effectiveRate;
        const total = consumptionCost + sharedPerTenant + additionalPerTenant;
        
        let chargesHtml = '';
        if (additionalCharges.length > 0) {
          chargesHtml = `<div class="text-sm text-blue-700">Additional: ₱${additionalPerTenant.toFixed(2)}</div>`;
        }

        const card = document.createElement('div');
        card.className = 'bg-blue-50 border border-blue-200 rounded-lg p-4';
        card.innerHTML = `
          <div class="font-semibold text-blue-900">${tenant.name || `Tenant ${i + 1}`}</div>
          <div class="text-sm text-blue-700 mt-1">Usage: ${tenant.kwh} kWh</div>
          <div class="text-sm text-blue-700">Consumption: ₱${consumptionCost.toFixed(2)}</div>
          <div class="text-sm text-blue-700">Shared: ₱${sharedPerTenant.toFixed(2)}</div>
          ${chargesHtml}
          <div class="text-xl font-bold text-blue-900 mt-2">₱${total.toFixed(2)}</div>
        `;
        resultsContent.appendChild(card);
      });

      saveDebt(currentTenants, currentAmounts);
      showDebtHistory();
      saveTenants();
      saveAdditionalCharges();
    }

    function getDebtKey(name) {
      return `billSplitter_debt_${name.replace(/\s+/g, '_')}`;
    }

    function saveDebt(currentTenants, currentAmounts) {
      const today = new Date().toISOString().slice(0, 7);
      
      currentTenants.forEach((tenant, i) => {
        const key = getDebtKey(tenant.name);
        const debt = parseFloat(localStorage.getItem(key)) || 0;
        localStorage.setItem(key, (debt + currentAmounts[i]).toFixed(2));
      });

      localStorage.setItem('billSplitter_lastBill', JSON.stringify({
        date: today,
        tenants: currentTenants.map(t => ({ name: t.name, amount: currentAmounts[currentTenants.indexOf(t)] }))
      }));
    }

    function showDebtHistory() {
      const debtSection = document.getElementById('debtSection');
      const debtTable = document.getElementById('debtTable');
      debtSection.classList.remove('hidden');
      debtTable.innerHTML = '';

      const uniqueNames = [...new Set(tenants.map(t => t.name))];
      
      if (uniqueNames.length === 0) {
        const current = getTenantData();
        current.forEach(t => uniqueNames.push(t.name));
      }

      uniqueNames.forEach(name => {
        const debt = parseFloat(localStorage.getItem(getDebtKey(name))) || 0;
        const row = document.createElement('tr');
        row.className = 'border-t';
        row.innerHTML = `
          <td class="px-4 py-2 font-medium">${name}</td>
          <td class="px-4 py-2 text-right">₱${debt.toFixed(2)}</td>
          <td class="px-4 py-2 text-right text-gray-500">-</td>
          <td class="px-4 py-2 text-right font-bold">₱${debt.toFixed(2)}</td>
          <td class="px-4 py-2 text-center">
            <button onclick="settleTenant('${name}')" class="text-green-600 hover:text-green-800 text-sm">Settle</button>
          </td>
        `;
        debtTable.appendChild(row);
      });
    }

    function settleTenant(name) {
      localStorage.removeItem(getDebtKey(name));
      showDebtHistory();
    }

    function settleDebt() {
      if (confirm('Settle all tenant debts? This will reset all balances to zero.')) {
        const uniqueNames = [...new Set(tenants.map(t => t.name))];
        uniqueNames.forEach(name => localStorage.removeItem(getDebtKey(name)));
        showDebtHistory();
      }
    }

    function clearHistory() {
      if (confirm('Clear all debt history? This cannot be undone.')) {
        const uniqueNames = [...new Set(tenants.map(t => t.name))];
        uniqueNames.forEach(name => localStorage.removeItem(getDebtKey(name)));
        showDebtHistory();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadTenants();
      loadAdditionalCharges();
      loadRateSettings();
      showDebtHistory();
    });

    function loadRateSettings() {
      const saved = localStorage.getItem('billSplitter_rates');
      if (saved) {
        const { ratePerKwh, totalKwh, totalBill } = JSON.parse(saved);
        if (ratePerKwh) document.getElementById('ratePerKwh').value = ratePerKwh;
        if (totalKwh) document.getElementById('totalKwh').value = totalKwh;
        if (totalBill) document.getElementById('totalBill').value = totalBill;
      }
    }
  </script>
</body>
</html>
